<style>
[hidden]{display:none!important}
:root{--sky:#cfe9e6;--paper:#fffaf0;--ink:#3b2a20;--teal:#4fb3b5;--coral:#f27c5c;--mus:#f2c14e;--soft:#7a6656;
  --font:"Kiwi Maru","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",serif}
*{box-sizing:border-box;margin:0;padding:0}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--sky)}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--font);color:var(--ink);overflow:hidden;height:100svh;background:var(--sky)}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.view{position:fixed;inset:0;height:100svh;overflow:hidden;z-index:2;background:var(--sky)}
.wrap{position:relative;height:100%;max-width:480px;margin:0 auto}

#loading{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--sky);transition:opacity .35s}
#loading .bb{position:relative;width:110px;height:110px}
#loading .bb i{position:absolute;left:30px;top:30px;width:50px;height:50px;border-radius:50%;border:2px solid rgba(79,179,181,.9);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9) 0 10%,rgba(255,255,255,.08) 22%,rgba(242,193,78,.12) 70%,rgba(242,124,92,.25) 100%);animation:grow 1.6s ease-in-out infinite}
#loading .bb b{position:absolute;left:47px;top:92px;width:16px;height:16px;border:3px solid var(--coral);border-radius:50%}
@keyframes grow{0%{transform:translateY(30px) scale(.2);opacity:0}30%{opacity:1}70%{transform:translateY(0) scale(1)}100%{transform:translateY(-28px) scale(1.05);opacity:0}}
#loading p{font-size:15px;color:var(--soft);letter-spacing:.06em}
#loadBar{width:150px;height:4px;background:rgba(59,42,32,.14);border-radius:2px;overflow:hidden}
#loadBar i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}

/* タイトル */
#vTitle .wrap{display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 20px calc(14px + calc(env(safe-area-inset-bottom) + var(--inapp-bot,0px)))}
#tArtBox{position:absolute;inset:0;z-index:0}
#tArt{position:absolute;inset:0;width:100%;height:100%}
#tH{position:relative;z-index:1;font-weight:500;font-size:min(12vw,52px,6.6svh);line-height:1.12;letter-spacing:.02em;text-shadow:0 2px 0 var(--paper),0 0 10px var(--paper)}
#tH span{display:block}
#tH .s1{font-size:.62em;color:var(--soft)}
#tH .s3{margin-left:1.6em;color:var(--coral)}
#tSub{position:relative;z-index:1;margin-top:6px;font-size:15px;color:var(--ink);text-shadow:0 0 6px var(--paper),0 0 3px var(--paper)}
.grow{flex:1}
#tBest{position:relative;z-index:1;font-size:14px;min-height:18px;text-align:center;margin-bottom:6px;text-shadow:0 0 6px var(--paper)}
/* 一番押してほしいボタン = うちわ */
#bStart{position:relative;z-index:1;align-self:center;width:170px;height:118px;margin-bottom:26px;transform:rotate(-6deg)}
#bStart .face{position:absolute;left:0;top:0;width:170px;height:118px;border-radius:50% 50% 44% 44%/58% 58% 42% 42%;background:var(--teal);border:3px solid var(--ink);box-shadow:inset 0 -10px 0 rgba(0,0,0,.08)}
#bStart .face:before{content:"";position:absolute;inset:9px;border-radius:inherit;border:2px dashed rgba(255,250,240,.55)}
#bStart .stick{position:absolute;left:78px;top:112px;width:14px;height:34px;border-radius:0 0 6px 6px;background:#c98d4f;border:3px solid var(--ink);border-top:0}
#bStart .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--paper);letter-spacing:.12em;text-shadow:0 2px 0 rgba(59,42,32,.45)}
#bStart:active{transform:rotate(4deg) scale(.97)}
.tLinks{position:relative;z-index:1;display:flex;gap:14px;justify-content:center;align-items:center}
.tLinks button{min-height:44px;padding:0 10px;font-size:15px;color:var(--ink);background:rgba(255,250,240,.82);border-radius:10px}
.ico{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 遊ぶ */
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;z-index:5;pointer-events:none;padding:calc(8px + env(safe-area-inset-top)) 10px 0 10px;display:flex;justify-content:space-between;align-items:flex-start}
/* 届けた数 = 配達伝票の切れはし */
#slip{position:relative;background:var(--paper);border:2px solid var(--ink);padding:4px 12px 6px 14px;transform:rotate(-2deg);box-shadow:2px 3px 0 rgba(59,42,32,.18)}
#slip:before{content:"";position:absolute;left:4px;top:6px;bottom:6px;border-left:2px dotted rgba(59,42,32,.35)}
#hN{font-size:40px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
#hN small{font-size:17px;margin-left:3px}
#hX{display:flex;gap:6px;margin-top:4px}
#hX svg{width:20px;height:20px}
#bMute2{width:44px;height:44px;display:flex;align-items:center;justify-content:center;pointer-events:auto;background:rgba(255,250,240,.75);border-radius:50%}
#bub{position:absolute;z-index:8;max-width:64%;background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:3px 11px 5px;font-size:16px;line-height:1.3;width:max-content;pointer-events:none;opacity:0;transition:opacity .12s;transform:translate(-50%,-100%)}
#bub.on{opacity:1}
#pop{position:absolute;z-index:6;color:var(--ink);-webkit-text-stroke:6px var(--paper);paint-order:stroke fill;left:50%;top:24%;transform:translate(-50%,-50%);font-size:28px;white-space:nowrap;pointer-events:none;opacity:0}
#pop.on{animation:pop 1.5s ease-out forwards}
#pop.bad{color:var(--coral)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%)}10%{opacity:1;transform:translate(-50%,-50%)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%)}}
#tut{position:absolute;left:0;right:0;bottom:calc(18px + calc(env(safe-area-inset-bottom) + var(--inapp-bot,0px)));z-index:6;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;transition:opacity .4s}
#tut p{font-size:15px;background:rgba(255,250,240,.92);padding:3px 12px;border-radius:8px}

/* 結果 */
#vEnd .wrap{display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 14px calc(8px + calc(env(safe-area-inset-bottom) + var(--inapp-bot,0px)))}
#resBox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#res{max-width:100%;max-height:100%;box-shadow:3px 5px 0 rgba(59,42,32,.2);transform:rotate(.8deg)}
#res.in{animation:resIn .6s ease-out}
@keyframes resIn{from{transform:translateY(-30px) rotate(-4deg);opacity:0}to{transform:rotate(.8deg);opacity:1}}
.endBtns{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:10px}
.endBtns .row{display:flex;gap:10px;justify-content:center;width:100%}
.endBtns .row button{min-height:44px;padding:0 16px;font-size:15px;color:var(--ink);border-bottom:2px solid var(--ink)}
#bAgain{width:min(70vw,250px);height:54px;background:var(--teal);color:var(--paper);border:3px solid var(--ink);border-radius:28px 28px 22px 22px;font-size:20px;letter-spacing:.1em;box-shadow:0 4px 0 var(--ink)}
#bAgain:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* 遊び方 */
.ovl{position:fixed;inset:0;z-index:80;background:rgba(59,42,32,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.ovl .in{position:relative;width:min(100%,420px);max-height:calc(100svh - 32px);overflow:auto;padding:18px 18px 12px;background:var(--paper);border:2px solid var(--ink)}
.ovl h3{font-size:21px;font-weight:500;margin-bottom:10px}
.ovl ol{padding-left:1.2em;display:flex;flex-direction:column;gap:9px;font-size:15px;line-height:1.6}
.ovl ol b{font-weight:500;background:linear-gradient(transparent 62%,rgba(242,193,78,.7) 62%)}
.ovl small{display:block;margin-top:12px;font-size:11px;line-height:1.5;color:var(--soft)}
.ovl .close{display:block;margin:12px auto 0;min-height:44px;padding:0 24px;font-size:16px;border-bottom:2px solid var(--ink)}
@media (max-height:700px){#tH{font-size:min(11vw,44px,6.4svh)}#bStart{transform:rotate(-6deg) scale(.85);margin-bottom:14px}#hN{font-size:34px}.ovl ol{font-size:14px;gap:6px}#bAgain{height:48px}}
</style>
</head>
<body>
<div id="loading"><div class="bb"><i></i><b></b></div><p id="loadTxt">シャボン液をまぜています</p><div id="loadBar"><i></i></div></div>

<main id="vTitle" class="view">
  <div id="tArtBox"><canvas id="tArt" aria-hidden="true"></canvas></div>
  <div class="wrap">
    <h1 id="tH"></h1>
    <p id="tSub"></p>
    <div class="grow"></div>
    <p id="tBest"></p>
    <button id="bStart"><span class="stick"></span><span class="face"></span><span class="t" id="bStartT"></span></button>
    <div class="tLinks"><button id="bHow"></button><button id="bLang"></button><button id="bMute" aria-label="sound"><svg class="ico" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5" style="display:none"/></svg></button></div>
  </div>
</main>

<main id="vPlay" class="view" hidden>
  <div class="wrap">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div id="slip"><div id="hN"></div><div id="hX"></div></div>
    <button id="bMute2" aria-label="sound"><svg class="ico" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5" style="display:none"/></svg></button>
  </div>
  <div id="bub"></div>
  <div id="pop"></div>
  <div id="tut"><p id="tutT"></p></div>
  </div>
</main>

<main id="vEnd" class="view" hidden>
  <div class="wrap">
    <div id="resBox"><canvas id="res" width="1080" height="1350"></canvas></div>
    <div class="endBtns">
      <button id="bAgain"></button>
      <div class="row"><button id="bSave"></button><button id="bPost"></button></div>
    </div>
  </div>
</main>

<div class="ovl" id="how" hidden><div class="in"><h3 id="howH"></h3><ol id="howBody"></ol><small id="howCred"></small><button class="close" id="howClose"></button></div></div>

<script>
(function(){
  var opt={passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('button,a')))e.preventDefault();last=n},opt);
  document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
  window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
})();
(function(){
  var errs=[];
  window.addEventListener('error',function(e){errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''))});
  window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason))});
  setTimeout(function(){
    if(window.__jsUp) return;
    var l=document.getElementById('loading');if(l)l.style.display='none';
    var d=document.createElement('div');d.style.cssText='position:fixed;inset:auto 8px 8px 8px;z-index:199;background:#fff;color:#b00;font:12px/1.4 monospace;white-space:pre-wrap;padding:10px';
    d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;
    document.body.appendChild(d);
  },15000);
})();
</script>
<script src="tm.js?v=1" data-game="shabondama"></script>
<script src="sfx.js?v=1"></script>
<script src="atlas.js?v=1"></script>
<script src="data.js?v=1"></script>

</body>
